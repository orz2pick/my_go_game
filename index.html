<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>围棋对弈</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,'PingFang SC','Helvetica Neue',sans-serif;display:flex;flex-direction:column}
body{background:#8B7355}

/* ===== 顶部信息栏 ===== */
#top-bar{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:6px 16px;background:linear-gradient(135deg,#5C4033,#8B6914);color:#fff;font-size:14px;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.4)}
#top-bar .turn{display:flex;align-items:center;gap:6px}
.turn-dot{display:inline-block;width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.3);flex-shrink:0}
.turn-dot.black{background:radial-gradient(circle at 35% 35%,#666,#111)}
.turn-dot.white{background:radial-gradient(circle at 35% 35%,#fff,#bbb)}
.capture-info{display:flex;gap:16px}

/* ===== 棋盘容器 ===== */
#board-wrap{flex:1;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}

/* ===== Canvas ===== */
canvas#board{display:block;border-radius:4px;touch-action:none}
#minimap{display:none;position:absolute;bottom:8px;right:8px;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.25);z-index:25;pointer-events:none}
#minimap.show{display:block}
#hand-cursor{position:absolute;pointer-events:none;z-index:20;opacity:0;transition:opacity .25s;width:48px;height:48px;display:none}
#hand-cursor.visible{opacity:1}

/* ===== 底部控制栏 ===== */
#bottom-bar{flex-shrink:0;display:flex;justify-content:center;gap:8px;padding:8px 12px 12px;background:linear-gradient(0deg,#3A2A1A,#5C4033);box-shadow:0 -2px 6px rgba(0,0,0,.4);flex-wrap:wrap}
#bottom-bar button{padding:7px 14px;border:none;border-radius:8px;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(135deg,#8B7355,#A0896A);box-shadow:0 2px 4px rgba(0,0,0,.3);cursor:pointer;transition:transform .1s,box-shadow .1s;min-width:60px;white-space:nowrap}
#bottom-bar button:active{transform:scale(.93);box-shadow:0 0 2px rgba(0,0,0,.3);color:#000}
#bottom-bar button:disabled{opacity:.4;transform:none;cursor:not-allowed}
#bottom-bar button.active{background:linear-gradient(135deg,#A07818,#C89820);color:#000}

/* ===== 结果弹窗 ===== */
#result-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center}
#result-overlay.show{display:flex}
#result-box{background:linear-gradient(135deg,#F5E6C8,#E8D5A8);border-radius:16px;padding:32px 40px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.5);max-width:90vw}
#result-box h2{font-size:24px;color:#3A2A1A;margin-bottom:8px}
#result-box p{font-size:18px;color:#5C4033;margin:6px 0}
#result-box .detail{font-size:14px;color:#8B7355;margin-top:12px}
#result-box button{margin-top:20px;padding:10px 36px;border:none;border-radius:8px;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(135deg,#8B6914,#A07818);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.3)}
#result-box button:active{transform:scale(.95)}

/* ===== 棋盘大小选择 ===== */
#size-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center}
#size-overlay.show{display:flex}
#size-box{background:linear-gradient(135deg,#F5E6C8,#E8D5A8);border-radius:16px;padding:36px 44px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.5);max-width:90vw}
#size-box h2{font-size:22px;color:#3A2A1A;margin-bottom:4px}
#size-box p{font-size:14px;color:#8B7355;margin-bottom:20px}
.size-btn{display:block;width:220px;padding:12px 0;margin:10px auto;border:none;border-radius:10px;font-size:20px;font-weight:700;color:#fff;background:linear-gradient(135deg,#8B6914,#A07818);cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25);transition:transform .1s}
.size-btn:active{transform:scale(.95)}
.size-btn .sub{display:block;font-size:12px;font-weight:400;opacity:.7;margin-top:2px}

/* ===== AI 思考遮罩 ===== */
#ai-overlay{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.55);z-index:50;align-items:center;justify-content:center;flex-direction:column;border-radius:4px}
#ai-overlay.show{display:flex}
#ai-overlay .spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:ai-spin .8s linear infinite}
#ai-overlay span{color:#fff;font-size:16px;font-weight:600;margin-top:14px;text-shadow:0 1px 4px rgba(0,0,0,.5);letter-spacing:1px}
#ai-overlay #ai-timer{color:#90EE90;font-size:14px;font-weight:400;margin-top:4px;font-family:monospace;letter-spacing:0}
@keyframes ai-spin{to{transform:rotate(360deg)}}

/* ===== 左侧棋局列表侧边栏 ===== */
#sidebar-backdrop{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.35);z-index:148}
#sidebar-backdrop.show{display:block}
#sidebar{position:fixed;top:44px;left:6px;width:280px;max-height:70vh;background:linear-gradient(180deg,#4A3728,#3A2A1A);z-index:150;transform:translateY(-120%);transition:transform .3s ease;box-shadow:0 6px 20px rgba(0,0,0,.55);border-radius:0 0 12px 12px;display:flex;flex-direction:column;overflow:hidden}
#sidebar.open{transform:translateY(0)}
#sidebar-toggle{position:fixed;top:44px;left:6px;z-index:151;width:auto;height:30px;padding:0 10px;border:none;border-radius:0 0 8px 8px;background:linear-gradient(135deg,#8B6914,#A07818);color:#fff;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:opacity .2s;display:flex;align-items:center;gap:4px}
#sidebar-toggle:hover{opacity:.85}
#sidebar.open ~ #sidebar-toggle{opacity:0;pointer-events:none}
#sidebar-header{padding:14px 16px;color:#F5E6C8;font-size:15px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
#sidebar-header small{font-size:11px;font-weight:400;opacity:.5}
#sidebar-list{flex:1;overflow-y:auto;padding:8px}
#sidebar-list::-webkit-scrollbar{width:4px}
#sidebar-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}
.sidebar-item{padding:10px 12px;margin:4px 0;border-radius:8px;background:rgba(255,255,255,.06);cursor:pointer;transition:background .15s;color:#ddd;font-size:13px;display:flex;align-items:center;gap:8px}
.sidebar-item:hover{background:rgba(255,255,255,.12)}
.sidebar-item .info{flex:1;min-width:0}
.sidebar-item .info .name{font-weight:600;color:#F5E6C8;font-size:13px}
.sidebar-item .info .meta{font-size:11px;opacity:.5;margin-top:2px}
.sidebar-item .del{background:none;border:none;color:rgba(255,100,100,.5);font-size:15px;cursor:pointer;padding:2px 4px;border-radius:4px;line-height:1;flex-shrink:0}
.sidebar-item .del:hover{color:#ff6b6b;background:rgba(255,100,100,.15)}
.sidebar-empty{padding:32px 16px;text-align:center;color:rgba(255,255,255,.25);font-size:13px;line-height:1.6}
#sidebar-new{flex-shrink:0;padding:12px 16px;border:none;border-top:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#F5E6C8;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;width:100%;text-align:center}
#sidebar-new:hover{background:rgba(255,255,255,.1)}
#sidebar-new:active{background:rgba(255,255,255,.05)}

/* ===== AI / 保存 / 读取 ===== */
#bottom-bar .sep{width:1px;height:28px;background:rgba(255,255,255,.15);margin:0 4px;align-self:center}
#bottom-bar .btn-ai{background:linear-gradient(135deg,#556B2F,#6B8E23)}
#bottom-bar .btn-ai.active{background:linear-gradient(135deg,#228B22,#32CD32);box-shadow:0 0 12px rgba(50,205,50,.4)}
#bottom-bar .btn-ai.active:active{box-shadow:0 0 4px rgba(50,205,50,.3)}
#bottom-bar .btn-save{background:linear-gradient(135deg,#4A6B8A,#5F9EA0)}
#bottom-bar .btn-load{background:linear-gradient(135deg,#8B5A2B,#CD853F)}
#bottom-bar #btn-bgm{background:linear-gradient(135deg,#5F4B8B,#7B68AE)}
#bottom-bar #btn-bgm.active{background:linear-gradient(135deg,#6A5ACD,#9370DB);box-shadow:0 0 12px rgba(106,90,205,.4)}
#ai-thinking{display:none;color:#90EE90;font-size:12px;font-weight:400;background:rgba(0,0,0,.3);padding:2px 10px;border-radius:10px;white-space:nowrap;animation:ai-pulse 1.2s ease-in-out infinite}
#ai-thinking.show{display:inline-block}
@keyframes ai-pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>

<div id="top-bar">
  <div class="turn">
    <span class="turn-dot black" id="turn-dot"></span>
    <span id="turn-text">黑棋落子</span>
  </div>
  <div class="capture-info">
    <span>⚫ 提子: <strong id="black-cap">0</strong></span>
    <span>⚪ 提子: <strong id="white-cap">0</strong></span>
    <span id="score-display" style="display:none;margin-left:10px;padding:2px 10px;background:rgba(255,255,255,.15);border-radius:6px;font-size:13px;">
      📊 目数: ⚫<strong id="black-score">0</strong> | ⚪<strong id="white-score">0</strong> <small style="opacity:.7;">(贴7.5)</small>
    </span>
  </div>
</div>

<div id="board-wrap">
  <canvas id="board"></canvas>
  <canvas id="minimap"></canvas>
  <div id="ai-overlay">
    <div class="spinner"></div>
    <span>AI 思考中…</span>
    <span id="ai-timer">0.00s</span>
  </div>
  <img id="hand-cursor" src="手指.png" alt="" draggable="false">
</div>

<div id="sidebar-backdrop"></div>
<div id="sidebar">
  <div id="sidebar-header">
    <span>📋 棋局列表</span>
    <small id="sidebar-count">0 局</small>
  </div>
  <div id="sidebar-list">
    <div class="sidebar-empty">暂无保存的棋局<br>对局中点击 💾 保存</div>
  </div>
  <button id="sidebar-new">＋ 新建棋局</button>
</div>
<button id="sidebar-toggle">棋局</button>

<div id="bottom-bar">
  <button id="btn-undo">⟲ 悔棋</button>
  <button id="btn-pass">停一手</button>
  <button id="btn-territory">🏁 领地</button>
  <button id="btn-count">📊 目数</button>
  <button id="btn-resign">🏳 认输</button>
  <button id="btn-count-result">🔢 数子结算</button>
  <span class="sep"></span>
  <button id="btn-ai" class="btn-ai">🤖 AI</button>
  <span id="ai-thinking">⏳ 思考中…</span>
  <button id="btn-save" class="btn-save">💾 保存</button>
  <button id="btn-load" class="btn-load">📂 读取</button>
  <button id="btn-bgm">🔊 BGM</button>
</div>

<div id="result-overlay">
  <div id="result-box">
    <h2 id="result-title"></h2>
    <p id="result-detail"></p>
    <p class="detail" id="result-breakdown"></p>
    <button id="btn-restart">再来一局</button>
  </div>
</div>

<div id="size-overlay">
  <div id="size-box">
    <h2>选择棋盘大小</h2>
    <p>围棋对弈</p>
    <button class="size-btn" data-size="9">9 ✕ 9<span class="sub">9路 · 入门</span></button>
    <button class="size-btn" data-size="13">13 ✕ 13<span class="sub">13路 · 中级</span></button>
    <button class="size-btn" data-size="19">19 ✕ 19<span class="sub">19路 · 标准</span></button>
  </div>
</div>

<script>
// ============================================================
// ====================== 1. 围棋规则引擎 ======================
// ============================================================
class GoGame {
  constructor(N) {
    this.N = N || 19;
    this.reset();
  }

  reset() {
    this.board = Array.from({length: this.N}, () => Array(this.N).fill(0));
    this.turn = 1;
    this.captures = {1: 0, 2: 0};
    this.history = [];
    this.koPoint = null;
    this.passCount = 0;
    this.gameOver = false;
    this.lastMove = null;
    this.territory = null;
    this.scores = null;
    this.valid = null;  // computeValidMoves() fills this
  }

  boardClone() {
    return this.board.map(row => [...row]);
  }

  getGroup(r, c) {
    const color = this.board[r][c];
    if (color === 0) return [];
    const visited = new Set();
    const group = [];
    const stack = [[r, c]];
    while (stack.length) {
      const [cr, cc] = stack.pop();
      const key = cr * this.N + cc;
      if (visited.has(key)) continue;
      visited.add(key);
      if (this.board[cr][cc] !== color) continue;
      group.push([cr, cc]);
      for (const [nr, nc] of this.neighbors(cr, cc)) {
        if (!visited.has(nr * this.N + nc)) stack.push([nr, nc]);
      }
    }
    return group;
  }

  getGroupLibertyCount(r, c) {
    const group = this.getGroup(r, c);
    if (group.length === 0) return 0;
    const libs = new Set();
    for (const [gr, gc] of group) {
      for (const [nr, nc] of this.neighbors(gr, gc)) {
        if (this.board[nr][nc] === 0) libs.add(nr * this.N + nc);
      }
    }
    return libs.size;
  }

  getLiberties(r, c) {
    const color = this.board[r][c];
    if (color === 0) return [];
    const group = this.getGroup(r, c);
    const libs = new Set();
    for (const [gr, gc] of group) {
      for (const [nr, nc] of this.neighbors(gr, gc)) {
        if (this.board[nr][nc] === 0) libs.add(nr * this.N + nc);
      }
    }
    return [...libs].map(k => [Math.floor(k / this.N), k % this.N]);
  }

  neighbors(r, c) {
    const n = [];
    if (r > 0) n.push([r - 1, c]);
    if (r < this.N - 1) n.push([r + 1, c]);
    if (c > 0) n.push([r, c - 1]);
    if (c < this.N - 1) n.push([r, c + 1]);
    return n;
  }

  isValidMove(r, c) {
    if (r < 0 || r >= this.N || c < 0 || c >= this.N) return false;
    if (this.board[r][c] !== 0) return false;
    if (this.gameOver) return false;
    if (this.koPoint && this.koPoint.r === r && this.koPoint.c === c) return false;

    const boardCopy = this.boardClone();
    boardCopy[r][c] = this.turn;
    const opp = this.turn === 1 ? 2 : 1;
    let canCap = false;

    for (const [nr, nc] of this.neighbors(r, c)) {
      if (boardCopy[nr][nc] === opp) {
        const grp = findGroupAt(nr, nc, boardCopy, this.N);
        if (findLibertiesAt(grp, boardCopy, this.N).length === 0) canCap = true;
      }
    }

    const myGroup = findGroupAt(r, c, boardCopy, this.N);
    if (findLibertiesAt(myGroup, boardCopy, this.N).length === 0 && !canCap) return false;
    return true;
  }

  // 计算所有合法落子位置（当前玩家）
  computeValidMoves() {
    this.valid = Array.from({length: this.N}, () => Array(this.N).fill(false));
    if (this.gameOver) return;
    for (let r = 0; r < this.N; r++) {
      for (let c = 0; c < this.N; c++) {
        if (this.board[r][c] !== 0) continue;
        if (this.koPoint && this.koPoint.r === r && this.koPoint.c === c) continue;
        // 快速判断：与对手棋子或空棋相邻才需要复杂检查
        const boardCopy = this.boardClone();
        boardCopy[r][c] = this.turn;
        const opp = this.turn === 1 ? 2 : 1;
        let canCap = false;
        for (const [nr, nc] of this.neighbors(r, c)) {
          if (boardCopy[nr][nc] === opp) {
            const grp = findGroupAt(nr, nc, boardCopy, this.N);
            if (findLibertiesAt(grp, boardCopy, this.N).length === 0) canCap = true;
          }
        }
        const myGroup = findGroupAt(r, c, boardCopy, this.N);
        if (findLibertiesAt(myGroup, boardCopy, this.N).length === 0 && !canCap) continue;
        this.valid[r][c] = true;
      }
    }
  }

  placeStone(r, c) {
    if (!this.isValidMove(r, c)) return false;

    this.history.push({
      board: this.boardClone(),
      captures: {...this.captures},
      koPoint: this.koPoint ? {...this.koPoint} : null,
      passCount: this.passCount,
      turn: this.turn,
      lastMove: this.lastMove ? {...this.lastMove} : null,
      gameOver: this.gameOver
    });

    this.board[r][c] = this.turn;
    const opp = this.turn === 1 ? 2 : 1;
    let captured = [];

    for (const [nr, nc] of this.neighbors(r, c)) {
      if (this.board[nr][nc] === opp) {
        const grp = this.getGroup(nr, nc);
        if (this.getLiberties(nr, nc).length === 0) {
          for (const [gr, gc] of grp) {
            this.board[gr][gc] = 0;
            captured.push([gr, gc]);
          }
        }
      }
    }

    this.captures[this.turn] += captured.length;

    if (captured.length === 1 && this.getGroup(r, c).length === 1) {
      this.koPoint = {r: captured[0][0], c: captured[0][1]};
    } else {
      this.koPoint = null;
    }

    this.lastMove = {r, c};
    this.passCount = 0;
    this.turn = opp;
    this.computeValidMoves();
    return true;
  }

  pass() {
    if (this.gameOver) return true;
    this.history.push({
      board: this.boardClone(),
      captures: {...this.captures},
      koPoint: this.koPoint ? {...this.koPoint} : null,
      passCount: this.passCount,
      turn: this.turn,
      lastMove: this.lastMove ? {...this.lastMove} : null,
      gameOver: this.gameOver
    });
    this.passCount++;
    this.koPoint = null;
    this.lastMove = null;
    this.turn = this.turn === 1 ? 2 : 1;
    if (this.passCount >= 2) {
      this.gameOver = true;
      this.calculateScore();
    }
    this.computeValidMoves();
    return this.gameOver;
  }

  resign() {
    if (this.gameOver) return;
    this.gameOver = true;
    this.scores = {
      winner: this.turn === 1 ? 2 : 1,
      byResign: true,
      resigner: this.turn === 1 ? '黑棋' : '白棋'
    };
  }

  undo() {
    if (this.history.length === 0) return false;
    if (this.gameOver) {
      this.gameOver = false;
      this.territory = null;
      this.scores = null;
    }
    const s = this.history.pop();
    this.board = s.board;
    this.captures = s.captures;
    this.koPoint = s.koPoint;
    this.passCount = s.passCount;
    this.turn = s.turn;
    this.lastMove = s.lastMove;
    if (s.gameOver !== undefined) this.gameOver = s.gameOver;
    this.computeValidMoves();
    return true;
  }

  calculateScore() {
    const N = this.N;
    this.territory = this.computeTerritoryImproved(this.board);

    let bs = 0, ws = 0;
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        if (this.board[r][c] === 1) bs++;
        else if (this.board[r][c] === 2) ws++;
        else if (this.territory[r][c] === 1) bs++;
        else if (this.territory[r][c] === 2) ws++;
      }
    }

    const komi = 7.5;
    this.scores = {
      blackScore: bs,
      whiteScore: ws + komi,
      territory: this.territory,
      komi: komi,
      winner: bs > ws + komi ? 1 : 2,
      diff: Math.abs(bs - (ws + komi))
    };
    return this.scores;
  }

  // 改进的领地计算：先移除"死子"再数空
  // 死子判定：气≤1 或 所有紧邻空点均被对方包围
  computeTerritoryImproved(boardSrc) {
    const N = this.N;
    const src = boardSrc || this.board;
    // 工作棋盘，死子将被移除
    const work = src.map(row => [...row]);

    // 迭代移除死子（最多 5 轮）
    for (let iter = 0; iter < 5; iter++) {
      const visited = new Set();
      const toRemove = [];

      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          if (work[r][c] !== 0 && !visited.has(r * N + c)) {
            const color = work[r][c];
            const group = [];
            const stack = [[r, c]];
            visited.add(r * N + c);
            while (stack.length) {
              const [gr, gc] = stack.pop();
              group.push([gr, gc]);
              for (const [nr, nc] of this.neighbors(gr, gc)) {
                if (work[nr][nc] === color && !visited.has(nr * N + nc)) {
                  visited.add(nr * N + nc);
                  stack.push([nr, nc]);
                }
              }
            }

            // 计算气
            const libs = new Set();
            for (const [gr, gc] of group) {
              for (const [nr, nc] of this.neighbors(gr, gc)) {
                if (work[nr][nc] === 0) libs.add(nr * N + nc);
              }
            }

            if (libs.size === 0) {
              toRemove.push(...group);
              continue;
            }

            if (libs.size === 1) {
              toRemove.push(...group);
              continue;
            }

            // 检查所有空邻是否都被对方"包围"
            const opp = color === 1 ? 2 : 1;
            let allLibsOpp = true;
            for (const libKey of libs) {
              const lr = Math.floor(libKey / N);
              const lc = libKey % N;
              // 从该空点出发 flood fill，看是否只与对方棋子相邻
              const seen = new Set();
              const eq = [[lr, lc]];
              seen.add(libKey);
              let onlyOpp = true;
              while (eq.length) {
                const [er, ec] = eq.pop();
                for (const [nr, nc] of this.neighbors(er, ec)) {
                  if (work[nr][nc] === 0 && !seen.has(nr * N + nc)) {
                    seen.add(nr * N + nc);
                    eq.push([nr, nc]);
                  } else if (work[nr][nc] !== 0 && work[nr][nc] !== opp) {
                    onlyOpp = false;
                  }
                }
              }
              if (!onlyOpp) { allLibsOpp = false; break; }
            }

            if (allLibsOpp) {
              toRemove.push(...group);
            }
          }
        }
      }

      if (toRemove.length === 0) break;
      for (const [rr, rc] of toRemove) work[rr][rc] = 0;
    }

    // 在清理后的棋盘上做标准 flood fill 领地计算
    const visited2 = Array.from({length: N}, () => Array(N).fill(false));
    const terr = Array.from({length: N}, () => Array(N).fill(0));
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        if (work[r][c] === 0 && !visited2[r][c]) {
          const eg = [];
          const borders = new Set();
          const stack = [[r, c]];
          visited2[r][c] = true;
          while (stack.length) {
            const [cr, cc] = stack.pop();
            eg.push([cr, cc]);
            for (const [nr, nc] of this.neighbors(cr, cc)) {
              if (work[nr][nc] === 0 && !visited2[nr][nc]) {
                visited2[nr][nc] = true;
                stack.push([nr, nc]);
              } else if (work[nr][nc] !== 0) {
                borders.add(work[nr][nc]);
              }
            }
          }
          if (borders.size === 1) {
            const owner = [...borders][0];
            eg.forEach(([tr, tc]) => { terr[tr][tc] = owner; });
          }
        }
      }
    }
    return terr;
  }

  // 计算当前领地（不计分，仅预览）
  computeTerritory() {
    return this.computeTerritoryImproved(this.board);
  }

  // 从已保存数据恢复状态
  restore(data) {
    this.N = data.N;
    this.board = data.board;
    this.turn = data.turn;
    this.captures = data.captures;
    this.history = data.history || [];
    this.koPoint = data.koPoint;
    this.passCount = data.passCount || 0;
    this.gameOver = data.gameOver || false;
    this.lastMove = data.lastMove || null;
    this.territory = data.territory || null;
    this.scores = data.scores || null;
    this.computeValidMoves();
  }
}

// ——— 轻量化棋盘状态（供 MCTS 推演使用） ———
class MCTSState {
  constructor(N) {
    this.N = N;
    this.board = Array.from({length: N}, () => new Array(N).fill(0));
    this.turn = 1;
    this.captures = {1: 0, 2: 0};
    this.koPoint = null;
    this.passCount = 0;
    this.lastMove = null;
  }

  static fromGame(game) {
    const s = new MCTSState(game.N);
    for (let r = 0; r < game.N; r++)
      for (let c = 0; c < game.N; c++)
        s.board[r][c] = game.board[r][c];
    s.turn = game.turn;
    s.captures = {1: game.captures[1] || 0, 2: game.captures[2] || 0};
    s.koPoint = game.koPoint ? {r: game.koPoint.r, c: game.koPoint.c} : null;
    s.passCount = game.passCount;
    s.lastMove = game.lastMove ? {r: game.lastMove.r, c: game.lastMove.c} : null;
    return s;
  }

  clone() {
    const s = new MCTSState(this.N);
    for (let r = 0; r < this.N; r++)
      for (let c = 0; c < this.N; c++)
        s.board[r][c] = this.board[r][c];
    s.turn = this.turn;
    s.captures = {1: this.captures[1], 2: this.captures[2]};
    s.koPoint = this.koPoint ? {r: this.koPoint.r, c: this.koPoint.c} : null;
    s.passCount = this.passCount;
    s.lastMove = this.lastMove ? {r: this.lastMove.r, c: this.lastMove.c} : null;
    return s;
  }

  neighbors(r, c) {
    const n = [];
    if (r > 0) n.push([r - 1, c]);
    if (r < this.N - 1) n.push([r + 1, c]);
    if (c > 0) n.push([r, c - 1]);
    if (c < this.N - 1) n.push([r, c + 1]);
    return n;
  }

  getGroup(r, c) {
    const color = this.board[r][c];
    if (color === 0) return [];
    const group = [];
    const visited = new Set();
    const stack = [[r, c]];
    while (stack.length) {
      const [cr, cc] = stack.pop();
      const key = cr * this.N + cc;
      if (visited.has(key)) continue;
      visited.add(key);
      if (this.board[cr][cc] !== color) continue;
      group.push([cr, cc]);
      for (const [nr, nc] of this.neighbors(cr, cc)) {
        if (!visited.has(nr * this.N + nc)) stack.push([nr, nc]);
      }
    }
    return group;
  }

  getGroupLiberties(group) {
    const libs = new Set();
    for (const [r, c] of group) {
      for (const [nr, nc] of this.neighbors(r, c)) {
        if (this.board[nr][nc] === 0) libs.add(nr * this.N + nc);
      }
    }
    return libs;
  }

  isValidMove(r, c) {
    if (this.board[r][c] !== 0) return false;
    if (this.koPoint && this.koPoint.r === r && this.koPoint.c === c) return false;
    const opp = this.turn === 1 ? 2 : 1;
    for (const [nr, nc] of this.neighbors(r, c)) {
      if (this.board[nr][nc] === 0) return true;
      if (this.board[nr][nc] === opp) {
        const grp = this.getGroup(nr, nc);
        if (this.getGroupLiberties(grp).size === 1) return true;
      }
    }
    for (const [nr, nc] of this.neighbors(r, c)) {
      if (this.board[nr][nc] === this.turn) {
        const grp = this.getGroup(nr, nc);
        const libs = this.getGroupLiberties(grp);
        if (libs.size > 1) return true;
        if (libs.size === 1) {
          const k = [...libs][0];
          if (k !== r * this.N + c) return true;
        }
      }
    }
    return false;
  }

  play(move) {
    if (!move) {
      this.passCount++;
      this.koPoint = null;
      this.lastMove = null;
      this.turn = this.turn === 1 ? 2 : 1;
      return;
    }
    const {r, c} = move;
    if (this.board[r][c] !== 0) return;
    if (this.koPoint && this.koPoint.r === r && this.koPoint.c === c) return;
    this.board[r][c] = this.turn;
    const opp = this.turn === 1 ? 2 : 1;
    let capTotal = 0;
    let firstCap = null;
    for (const [nr, nc] of this.neighbors(r, c)) {
      if (this.board[nr][nc] === opp) {
        const grp = this.getGroup(nr, nc);
        if (this.getGroupLiberties(grp).size === 0) {
          for (const [gr, gc] of grp) this.board[gr][gc] = 0;
          capTotal += grp.length;
          if (!firstCap) firstCap = grp[0];
        }
      }
    }
    this.captures[this.turn] += capTotal;
    this.koPoint = (capTotal === 1 && this.getGroup(r, c).length === 1 && firstCap)
      ? {r: firstCap[0], c: firstCap[1]} : null;
    this.passCount = 0;
    this.lastMove = {r, c};
    this.turn = opp;
  }

  rollRandomMove() {
    const N = this.N;
    for (let t = 0; t < 25; t++) {
      const r = Math.floor(Math.random() * N);
      const c = Math.floor(Math.random() * N);
      if (this.isValidMove(r, c)) return {r, c};
    }
    for (let r = 0; r < N; r++)
      for (let c = 0; c < N; c++)
        if (this.isValidMove(r, c)) return {r, c};
    return null;
  }

  getWinner() {
    const N = this.N;
    const visited = Array.from({length: N}, () => new Array(N).fill(false));
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        if (this.board[r][c] !== 0 || visited[r][c]) continue;
        const borders = new Set();
        const stack = [[r, c]];
        visited[r][c] = true;
        while (stack.length) {
          const [cr, cc] = stack.pop();
          for (const [nr, nc] of this.neighbors(cr, cc)) {
            if (this.board[nr][nc] === 0 && !visited[nr][nc]) { visited[nr][nc] = true; stack.push([nr, nc]); }
            else if (this.board[nr][nc] !== 0) borders.add(this.board[nr][nc]);
          }
        }
        if (borders.size === 1) {
          const owner = [...borders][0];
          stack.push([r, c]); visited[r][c] = true;
          while (stack.length) {
            const [cr, cc] = stack.pop();
            this.board[cr][cc] = owner;
            for (const [nr, nc] of this.neighbors(cr, cc)) {
              if (this.board[nr][nc] === 0 && !visited[nr][nc]) { visited[nr][nc] = true; stack.push([nr, nc]); }
            }
          }
        }
      }
    }
    let bs = 0, ws = 0;
    for (let r = 0; r < N; r++)
      for (let c = 0; c < N; c++) {
        if (this.board[r][c] === 1) bs++;
        else if (this.board[r][c] === 2) ws++;
      }
    ws += 7.5;
    return bs > ws ? 1 : 2;
  }
}

// ——— MCTS 节点 ———
class MCTSNode {
  constructor(state, parent, move) {
    this.state = state;
    this.parent = parent;
    this.move = move;
    this.children = [];
    this.visits = 0;
    this.wins = 0;
    this.untriedMoves = null;
  }

  isFullyExpanded() {
    return this.untriedMoves !== null && this.untriedMoves.length === 0;
  }
}

// ——— MCTS 核心算法 ———
function mctsSelect(node) {
  const C = Math.SQRT2, logP = Math.log(node.visits);
  let best = null, bestVal = -Infinity;
  for (const ch of node.children) {
    const uct = ch.wins / ch.visits + C * Math.sqrt(logP / ch.visits);
    if (uct > bestVal) { bestVal = uct; best = ch; }
  }
  return best;
}

function mctsRollout(state, maxMoves) {
  const sim = state.clone();
  for (let i = 0; i < maxMoves; i++) {
    if (sim.passCount >= 2) break;
    const m = sim.rollRandomMove();
    sim.play(m);
  }
  return sim.getWinner();
}

function mctsSearch(rootState, iterations, maxRollout) {
  const root = new MCTSNode(rootState, null, null);
  for (let iter = 0; iter < iterations; iter++) {
    let node = root;
    while (node.state.passCount < 2 && node.isFullyExpanded()) {
      const c = mctsSelect(node);
      if (!c) break;
      node = c;
    }
    if (node.state.passCount < 2) {
      if (node.untriedMoves === null) {
        const moves = [];
        for (let r = 0; r < node.state.N; r++)
          for (let c = 0; c < node.state.N; c++)
            if (node.state.isValidMove(r, c)) moves.push({r, c});
        for (let i = moves.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [moves[i], moves[j]] = [moves[j], moves[i]]; }
        node.untriedMoves = moves;
      }
      if (node.untriedMoves.length > 0) {
        const mv = node.untriedMoves.pop();
        const ns = node.state.clone();
        ns.play(mv);
        node.children.push(new MCTSNode(ns, node, mv));
        node = node.children[node.children.length - 1];
      }
    }
    const winner = (node.state.passCount >= 2) ? node.state.getWinner() : mctsRollout(node.state, maxRollout);
    let n = node;
    while (n) { n.visits++; if (winner && winner === n.state.turn) n.wins++; n = n.parent; }
  }
  let best = null, bestRate = -1;
  for (const ch of root.children) {
    const rate = ch.wins / ch.visits;
    if (rate > bestRate) { bestRate = rate; best = ch; }
  }
  return best ? best.move : null;
}

// ——— GoAI 适配器：9×9 → MCTS，13×13/19×19 → 贪心启发式 ———
class GoAI {
  constructor(game, color) {
    this.game = game;
    this.color = color;
  }

  getBestMove() {
    const N = this.game.N;
    if (N <= 9) {
      const rootState = MCTSState.fromGame(this.game);
      return mctsSearch(rootState, 2000, 30);
    }
    return this.greedyBestMove();
  }

  greedyBestMove() {
    const game = this.game;
    const N = game.N;
    const opp = this.color === 1 ? 2 : 1;
    const board = game.board;
    let bestScore = -Infinity;
    let bestMove = null;

    const myGroups = greedyGetAllGroups(board, N, this.color);
    const oppGroups = greedyGetAllGroups(board, N, opp);
    const myWeakSet = new Set();
    const oppWeakSet = new Set();
    for (const g of myGroups) {
      const libs = greedyGroupLibs(g, board, N);
      if (libs.length <= 3) libs.forEach(k => myWeakSet.add(k));
    }
    for (const g of oppGroups) {
      const libs = greedyGroupLibs(g, board, N);
      if (libs.length <= 2) libs.forEach(k => oppWeakSet.add(k));
    }

    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        if (!game.isValidMove(r, c)) continue;

        let score = 0;
        const mk = r * N + c;

        const bc = game.boardClone();
        bc[r][c] = this.color;

        let captures = 0;
        for (const [nr, nc] of game.neighbors(r, c)) {
          if (bc[nr][nc] === opp) {
            const grp = findGroupAt(nr, nc, bc, N);
            if (findLibertiesAt(grp, bc, N).length === 0) captures += grp.length;
          }
        }
        score += captures * 200;

        if (captures === 0) {
          let allOwn = true;
          for (const [nr, nc] of game.neighbors(r, c)) {
            if (game.board[nr][nc] !== this.color) { allOwn = false; break; }
          }
          if (allOwn) score -= 5000;
        }

        const myGrpAfter = findGroupAt(r, c, bc, N);
        const myLibsAfter = findLibertiesAt(myGrpAfter, bc, N);
        if (myLibsAfter.length === 0 && captures === 0) score -= 500;
        else if (myLibsAfter.length === 1 && captures === 0) score -= 200;

        // ① 救活被打吃的己方棋团（当前棋盘上己方团仅 1 气）
        if (captures === 0 && myLibsAfter.length >= 1) {
          for (const [nr, nc] of game.neighbors(r, c)) {
            if (game.board[nr][nc] === this.color) {
              const grp = findGroupAt(nr, nc, game.board, N);
              if (findLibertiesAt(grp, game.board, N).length === 1) {
                score += 500; break;
              }
            }
          }
        }

        // ② 攻击：落子后对方棋团被打吃（剩 1 气）
        for (const [nr, nc] of game.neighbors(r, c)) {
          if (bc[nr][nc] === opp) {
            const grp = findGroupAt(nr, nc, bc, N);
            if (findLibertiesAt(grp, bc, N).length === 1) score += 150;
          }
        }

        // ③ 连接己方不同棋团
        const ownGroupIds = new Set();
        for (const [nr, nc] of game.neighbors(r, c)) {
          if (game.board[nr][nc] === this.color) {
            const grp = findGroupAt(nr, nc, game.board, N);
            if (grp.length) ownGroupIds.add(grp[0][0] * N + grp[0][1]);
          }
        }
        if (ownGroupIds.size >= 2) score += 50 * (ownGroupIds.size - 1);

        // ④ 弱棋处理
        if (myWeakSet.has(mk)) {
          score += Math.max(0, myLibsAfter.length - 1) * 80 + 60;
        }
        if (oppWeakSet.has(mk)) score += 120;

        // ⑤ 做眼
        const eyeScore = greedyEyeVal(r, c, board, bc, N, this.color, opp);
        score += eyeScore;

        // ⑥ 连己方 & 靠对方
        let conn = 0, adjOpp = 0;
        for (const [nr, nc] of game.neighbors(r, c)) {
          if (game.board[nr][nc] === this.color) conn++;
          if (game.board[nr][nc] === opp) adjOpp++;
        }
        score += conn * 18 + adjOpp * 4;

        // ⑦ 位置偏好（13 路星位优先）
        const de = Math.min(r, c, N - 1 - r, N - 1 - c);
        if (de === 3) score += N === 13 ? 10 : 6;
        else if (de === 2) score += N === 13 ? 7 : 8;
        else if (de === 1) score += 4;
        else if (de === 0) score += 3;

        // ⑧ 靠近对手最近落子
        if (game.lastMove) {
          const dd = Math.abs(r - game.lastMove.r) + Math.abs(c - game.lastMove.c);
          if (dd <= 3) score += 6 - dd;
        }

        if (score > bestScore) { bestScore = score; bestMove = { r, c }; }
      }
    }
    if (bestScore < -100) return null;
    return bestMove;
  }
}

// ——— 贪心 AI 辅助函数 ———
function greedyGetAllGroups(board, N, color) {
  const visited = Array.from({length: N}, () => Array(N).fill(false));
  const groups = [];
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      if (board[r][c] !== color || visited[r][c]) continue;
      const group = [];
      const stack = [[r, c]];
      visited[r][c] = true;
      while (stack.length) {
        const [cr, cc] = stack.pop();
        group.push([cr, cc]);
        for (const [nr, nc] of neighborsAt(cr, cc, N)) {
          if (board[nr][nc] === color && !visited[nr][nc]) { visited[nr][nc] = true; stack.push([nr, nc]); }
        }
      }
      groups.push(group);
    }
  }
  return groups;
}

function greedyGroupLibs(group, board, N) {
  const libs = new Set();
  for (const [r, c] of group) {
    for (const [nr, nc] of neighborsAt(r, c, N)) {
      if (board[nr][nc] === 0) libs.add(nr * N + nc);
    }
  }
  return [...libs];
}

function greedyEyeVal(r, c, origBoard, simBoard, N, color, opp) {
  let val = 0;
  for (const [nr, nc] of neighborsAt(r, c, N)) {
    if (simBoard[nr][nc] !== 0) continue;
    let adj = 0;
    for (const [nnr, nnc] of neighborsAt(nr, nc, N)) {
      if (simBoard[nnr][nnc] === color) adj++;
    }
    if (adj === 4) val += 300;
    else if (adj === 3) val += 80;
  }
  let adjColor = 0;
  for (const [nr, nc] of neighborsAt(r, c, N)) {
    if (simBoard[nr][nc] === color) adjColor++;
  }
  if (adjColor >= 3) val += 60;
  return val;
}

function findGroupAt(r, c, board, N) {
  const color = board[r][c];
  if (color === 0) return [];
  const visited = new Set();
  const group = [];
  const stack = [[r, c]];
  while (stack.length) {
    const [cr, cc] = stack.pop();
    const key = cr * N + cc;
    if (visited.has(key)) continue;
    visited.add(key);
    if (board[cr][cc] !== color) continue;
    group.push([cr, cc]);
    for (const [nr, nc] of neighborsAt(cr, cc, N)) {
      if (!visited.has(nr * N + nc)) stack.push([nr, nc]);
    }
  }
  return group;
}

function findLibertiesAt(group, board, N) {
  const libs = new Set();
  for (const [gr, gc] of group) {
    for (const [nr, nc] of neighborsAt(gr, gc, N)) {
      if (board[nr][nc] === 0) libs.add(nr * N + nc);
    }
  }
  return [...libs];
}

function neighborsAt(r, c, N) {
  const n = [];
  if (r > 0) n.push([r - 1, c]);
  if (r < N - 1) n.push([r + 1, c]);
  if (c > 0) n.push([r, c - 1]);
  if (c < N - 1) n.push([r, c + 1]);
  return n;
}

// ====================== 2. 棋盘渲染 ==========================
// ============================================================
class BoardRenderer {
  constructor(canvas, game) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.game = game;
    this.N = game.N;
    this.CELL = 0;
    this.PAD = 0;
    this.STONE_R = 0;
    this.W = 0;
    this.H = 0;
    this.ghostPos = null;
    this.animating = null;
    this.scale = 1;
    this.transX = 0;
    this.transY = 0;
    this.showTerritory = false;
    this.cachedTerritory = null;
    this.libertyFontSize = 0;
    // minimap
    this.miniCanvas = document.getElementById('minimap');
    this.miniCtx = this.miniCanvas.getContext('2d');
  }

  calcSize() {
    const wrap = this.canvas.parentElement;
    const wrapW = wrap.clientWidth;
    const wrapH = wrap.clientHeight;
    const maxW = Math.min(wrapW - 4, 800);
    const maxH = wrapH - 4;
    const idealCell = Math.min(Math.floor(maxW / 20), Math.floor(maxH / 20));
    this.CELL = Math.max(idealCell, 16);
    this.PAD = this.CELL;
    this.STONE_R = this.CELL * 0.44;
    this.libertyFontSize = Math.max(11, Math.round(this.CELL * 0.48));
    this.W = (this.N - 1) * this.CELL + 2 * this.PAD;
    this.H = this.W;
    this.canvas.width = this.W;
    this.canvas.height = this.H;
    this.canvas.style.width = this.W + 'px';
    this.canvas.style.height = this.H + 'px';
    const miniSize = Math.max(80, Math.min(150, this.CELL * 3.5));
    this.miniCanvas.width = miniSize;
    this.miniCanvas.height = miniSize;
  }

  pointToCanvas(r, c) {
    return {x: this.PAD + c * this.CELL, y: this.PAD + r * this.CELL};
  }

  canvasToPoint(px, py) {
    const c = Math.round((px - this.PAD) / this.CELL);
    const r = Math.round((py - this.PAD) / this.CELL);
    if (r < 0 || r >= this.N || c < 0 || c >= this.N) return null;
    const pt = this.pointToCanvas(r, c);
    const dist = Math.hypot(px - pt.x, py - pt.y);
    if (dist > this.CELL * 0.5) return null;
    return {r, c};
  }

  drawBackground() {
    const ctx = this.ctx;
    const W = this.canvas.width, H = this.canvas.height;
    ctx.fillStyle = '#D4A853';
    ctx.fillRect(0, 0, W, H);
    const imageData = ctx.getImageData(0, 0, W, H);
    const data = imageData.data;
    for (let y = 0; y < H; y++) {
      const wave = Math.sin(y * 0.04) * 8 + Math.sin(y * 0.07) * 4 + Math.cos(y * 0.015) * 6;
      const bright = 1 + wave / 200;
      for (let x = 0; x < W; x++) {
        const idx = (y * W + x) * 4;
        const grain = Math.sin(x * 0.002 + y * 0.05) * 3;
        data[idx]     = Math.min(255, Math.max(0, data[idx] * bright + grain));
        data[idx + 1] = Math.min(255, Math.max(0, data[idx + 1] * bright + grain));
        data[idx + 2] = Math.min(255, Math.max(0, data[idx + 2] * bright * 0.98 + grain));
      }
    }
    ctx.putImageData(imageData, 0, 0);
    const grad = ctx.createRadialGradient(W/2, H/2, W*0.3, W/2, H/2, W*0.7);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.15)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  drawGrid() {
    const ctx = this.ctx;
    const end = (this.N - 1) * this.CELL;
    ctx.strokeStyle = '#5C4033';
    ctx.lineWidth = 1;
    for (let i = 0; i < this.N; i++) {
      const p = this.PAD + i * this.CELL;
      ctx.beginPath(); ctx.moveTo(this.PAD, p); ctx.lineTo(this.PAD + end, p); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p, this.PAD); ctx.lineTo(p, this.PAD + end); ctx.stroke();
    }
    const stars = this.getStarPoints();
    ctx.fillStyle = '#5C4033';
    for (const [r, c] of stars) {
      const {x, y} = this.pointToCanvas(r, c);
      ctx.beginPath(); ctx.arc(x, y, this.CELL * 0.12, 0, Math.PI * 2); ctx.fill();
    }
  }

  getStarPoints() {
    const N = this.N;
    let positions;
    if (N === 9) {
      positions = [2, 4, 6];
    } else if (N === 11) {
      positions = [2, 5, 8];
    } else if (N === 13) {
      positions = [3, 6, 9];
    } else {
      const edge = Math.min(3, Math.floor((N - 1) / 6));
      positions = [edge, Math.floor(N / 2), N - 1 - edge];
    }
    const pts = [];
    for (const r of positions) {
      for (const c of positions) {
        pts.push([r, c]);
      }
    }
    return pts;
  }

  drawStoneAt(r, c, color, ghost, scale_) {
    const ctx = this.ctx;
    const {x, y} = this.pointToCanvas(r, c);
    const r0 = this.STONE_R * (scale_ || 1);
    const alpha = ghost ? 0.35 : 1;
    ctx.save();
    ctx.globalAlpha = alpha;
    if (!ghost) {
      ctx.shadowColor = 'rgba(0,0,0,0.35)';
      ctx.shadowBlur = 4;
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 2;
    }
    if (color === 1) {
      const g = ctx.createRadialGradient(x - r0*0.25, y - r0*0.3, r0*0.1, x + r0*0.05, y + r0*0.05, r0);
      g.addColorStop(0, ghost ? '#888' : '#777');
      g.addColorStop(0.5, ghost ? '#555' : '#333');
      g.addColorStop(1, ghost ? '#333' : '#111');
      ctx.fillStyle = g;
    } else {
      const g = ctx.createRadialGradient(x - r0*0.3, y - r0*0.3, r0*0.1, x + r0*0.05, y + r0*0.05, r0);
      g.addColorStop(0, ghost ? '#fff' : '#fff');
      g.addColorStop(0.6, ghost ? '#eee' : '#eee');
      g.addColorStop(1, ghost ? '#ccc' : '#bbb');
      ctx.fillStyle = g;
      if (!ghost) ctx.shadowColor = 'rgba(0,0,0,0.25)';
    }
    ctx.beginPath(); ctx.arc(x, y, r0, 0, Math.PI * 2); ctx.fill();
    if (color === 2 && !ghost) {
      ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 0.5; ctx.stroke();
    }
    ctx.restore();
  }

  drawAllStones() {
    const board = this.game.board;
    for (let r = 0; r < this.N; r++) {
      for (let c = 0; c < this.N; c++) {
        if (board[r][c] !== 0) {
          this.drawStoneAt(r, c, board[r][c], false);
        }
      }
    }
    // 在棋子上绘制气数
    const ctx = this.ctx;
    ctx.save();
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let r = 0; r < this.N; r++) {
      for (let c = 0; c < this.N; c++) {
        if (board[r][c] !== 0) {
          const libs = this.game.getGroupLibertyCount(r, c);
          const {x, y} = this.pointToCanvas(r, c);
          const fs = this.libertyFontSize;
          const bgR = fs * 0.65;
          // 背景圆—使用棋子同色渐变
          const grad = ctx.createRadialGradient(x, y, 0, x, y, bgR);
          if (board[r][c] === 1) {
            grad.addColorStop(0, 'rgba(80,80,80,0.65)');
            grad.addColorStop(1, 'rgba(30,30,30,0.8)');
          } else {
            grad.addColorStop(0, 'rgba(255,255,255,0.7)');
            grad.addColorStop(1, 'rgba(200,200,200,0.6)');
          }
          ctx.fillStyle = grad;
          ctx.beginPath(); ctx.arc(x, y, bgR, 0, Math.PI * 2); ctx.fill();
          // 文字
          ctx.font = `900 ${fs}px -apple-system,sans-serif`;
          ctx.fillStyle = board[r][c] === 1 ? '#fff' : '#111';
          ctx.fillText(libs, x, y + 0.5);
        }
      }
    }
    ctx.restore();
  }

  drawInvalidMoves() {
    const valid = this.game.valid;
    const board = this.game.board;
    if (!valid || this.game.gameOver) return;
    const ctx = this.ctx;
    ctx.save();
    ctx.shadowColor = 'transparent';
    ctx.strokeStyle = 'rgba(220,40,40,0.55)';
    ctx.lineWidth = 1.5;
    for (let r = 0; r < this.N; r++) {
      for (let c = 0; c < this.N; c++) {
        if (board[r][c] !== 0) continue;
        if (valid[r][c]) continue;
        const {x, y} = this.pointToCanvas(r, c);
        const s = this.CELL * 0.2;
        ctx.beginPath();
        ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s);
        ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  drawLastMove() {
    const lm = this.game.lastMove;
    if (!lm) return;
    const clr = this.game.board[lm.r][lm.c];
    if (clr === 0) return;
    const {x, y} = this.pointToCanvas(lm.r, lm.c);
    const ctx = this.ctx;
    ctx.save();
    ctx.shadowColor = 'transparent';
    // 发光光环：从半透明到渐变消失
    const glowR = this.STONE_R * 1.5;
    const grad = ctx.createRadialGradient(x, y, this.STONE_R * 0.3, x, y, glowR);
    if (clr === 1) {
      grad.addColorStop(0, 'rgba(255,215,0,0.35)');
      grad.addColorStop(0.5, 'rgba(255,215,0,0.15)');
      grad.addColorStop(1, 'rgba(255,215,0,0)');
    } else {
      grad.addColorStop(0, 'rgba(100,200,255,0.4)');
      grad.addColorStop(0.5, 'rgba(100,200,255,0.15)');
      grad.addColorStop(1, 'rgba(100,200,255,0)');
    }
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x, y, glowR, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  drawTerritory(terr, globalAlpha) {
    if (!terr) return;
    const ctx = this.ctx;
    ctx.save();
    ctx.shadowColor = 'transparent';
    ctx.globalAlpha = globalAlpha || 0.5;
    for (let r = 0; r < this.N; r++) {
      for (let c = 0; c < this.N; c++) {
        if (terr[r][c] !== 0) {
          const {x, y} = this.pointToCanvas(r, c);
          ctx.fillStyle = terr[r][c] === 1 ? 'rgba(255,80,80,0.5)' : 'rgba(80,160,255,0.5)';
          ctx.fillRect(x - this.CELL/2, y - this.CELL/2, this.CELL, this.CELL);
        }
      }
    }
    ctx.restore();
  }

  render() {
    const ctx = this.ctx;
    this.drawBackground();
    ctx.save();

    ctx.translate(this.transX, this.transY);
    ctx.scale(this.scale, this.scale);

    ctx.beginPath();
    ctx.rect(this.PAD - this.CELL*0.5, this.PAD - this.CELL*0.5,
             this.N * this.CELL, this.N * this.CELL);
    ctx.clip();

    this.drawGrid();
    this.drawAllStones();
    this.drawLastMove();
    this.drawInvalidMoves();

    // 终局领地 or 领地预览
    if (this.game.gameOver && this.game.territory) {
      this.drawTerritory(this.game.territory, 0.35);
    } else if (this.showTerritory) {
      if (!this.cachedTerritory) this.cachedTerritory = this.game.computeTerritory();
      this.drawTerritory(this.cachedTerritory, 0.5);
    }

    if (this.ghostPos) {
      const g = this.ghostPos;
      if (this.game.isValidMove(g.r, g.c)) {
        this.drawStoneAt(g.r, g.c, g.color, true);
      }
    }

    if (this.animating) {
      const a = this.animating;
      const s = a.progress < 0.5
        ? 1.2 * (a.progress / 0.5)
        : 1.2 - 0.2 * ((a.progress - 0.5) / 0.5);
      this.drawStoneAt(a.r, a.c, a.color, false, s);
    }

    ctx.restore();
    this.drawMinimap();
  }

  startAnimation(r, c, color) {
    this.animating = {r, c, color, progress: 0, startTime: performance.now()};
  }

  drawMinimap() {
    // 仅在缩放或平移明显时显示
    const zoomed = Math.abs(this.scale - 1) > 0.05 || Math.abs(this.transX) > 5 || Math.abs(this.transY) > 5;
    this.miniCanvas.classList.toggle('show', zoomed);
    if (!zoomed) return;

    const mc = this.miniCtx;
    const mw = this.miniCanvas.width, mh = this.miniCanvas.height;
    const pad = 3;
    const cell = (mw - pad * 2) / this.N;
    const off = pad + cell / 2;

    mc.clearRect(0, 0, mw, mh);
    // 背景
    mc.fillStyle = '#D4A853';
    mc.fillRect(0, 0, mw, mh);

    // 网格
    mc.strokeStyle = 'rgba(60,40,20,0.4)';
    mc.lineWidth = 0.5;
    for (let i = 0; i < this.N; i++) {
      const p = off + i * cell;
      mc.beginPath(); mc.moveTo(off, p); mc.lineTo(off + (this.N-1)*cell, p); mc.stroke();
      mc.beginPath(); mc.moveTo(p, off); mc.lineTo(p, off + (this.N-1)*cell); mc.stroke();
    }

    // 星位
    const stars = this.getStarPoints();
    mc.fillStyle = 'rgba(60,40,20,0.5)';
    for (const [r, c] of stars) {
      mc.beginPath(); mc.arc(off + c * cell, off + r * cell, cell * 0.3, 0, 7); mc.fill();
    }

    // 棋子
    const board = this.game.board;
    for (let r = 0; r < this.N; r++) {
      for (let c = 0; c < this.N; c++) {
        if (board[r][c] !== 0) {
          const px = off + c * cell, py = off + r * cell;
          mc.beginPath(); mc.arc(px, py, cell * 0.38, 0, 7);
          mc.fillStyle = board[r][c] === 1 ? '#333' : '#fff';
          mc.fill();
          if (board[r][c] === 2) { mc.strokeStyle = 'rgba(0,0,0,0.2)'; mc.lineWidth = 0.5; mc.stroke(); }
        }
      }
    }

    // 视野矩形
    const vLeft = -this.transX / this.scale;
    const vTop = -this.transY / this.scale;
    const vW = this.canvas.width / this.scale;
    const vH = this.canvas.height / this.scale;
    const sx = (vLeft / this.W) * mw;
    const sy = (vTop / this.H) * mh;
    const sw = (vW / this.W) * mw;
    const sh = (vH / this.H) * mh;
    mc.strokeStyle = '#fff';
    mc.lineWidth = 1.5;
    mc.shadowColor = 'rgba(0,0,0,0.5)';
    mc.shadowBlur = 4;
    mc.strokeRect(sx, sy, sw, sh);
    mc.shadowColor = 'transparent';
    mc.shadowBlur = 0;
    mc.fillStyle = 'rgba(255,255,255,0.08)';
    mc.fillRect(sx, sy, sw, sh);
  }
}

// ====================== 3. 音效（钢琴音色） ==================
// ============================================================
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// 钢琴单音：正弦波 + 快速起音 + 自然衰减
function playPianoNote(freq, startTime, duration, gain) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  osc.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, startTime);
  gainNode.gain.setValueAtTime(0, startTime);
  gainNode.gain.linearRampToValueAtTime(gain || 0.25, startTime + 0.008);
  gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.start(startTime);
  osc.stop(startTime + duration);
}

// 钢琴和弦：同时播放多个频率
function playChord(freqs, startTime, duration, gain) {
  freqs.forEach(f => playPianoNote(f, startTime, duration, gain));
}

// 黑棋落子：两个低音和弦 (Cmaj → Gmaj, C3 八度)
function playBlackMoveSound() {
  try {
    initAudio();
    const now = audioCtx.currentTime;
    // 和弦1: Cmaj (C3+E3+G3)
    playChord([130.81, 164.81, 196.00], now, 0.28, 0.13);
    // 和弦2: Gmaj (G3+B3+D4)，与前和弦有重叠
    playChord([196.00, 246.94, 293.66], now + 0.14, 0.32, 0.11);
  } catch(e) {}
}

// 白棋落子：两个高音和弦 (Cmaj → Gmaj, C4 八度)
function playWhiteMoveSound() {
  try {
    initAudio();
    const now = audioCtx.currentTime;
    // 和弦1: Cmaj (C4+E4+G4)
    playChord([261.63, 329.63, 392.00], now, 0.25, 0.14);
    // 和弦2: Gmaj (G4+B4+D5)
    playChord([392.00, 493.88, 587.33], now + 0.12, 0.28, 0.12);
  } catch(e) {}
}

// 非法落子音效：轻柔短促的 "boop"
function playInvalidSound() {
  try {
    initAudio();
    const now = audioCtx.currentTime;
    // 一个快速下行的柔和音
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(380, now);
    osc.frequency.exponentialRampToValueAtTime(240, now + 0.1);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.12, now + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.start(now); osc.stop(now + 0.15);
  } catch(e) {}
}

// ——— 鼓合成 ———
function playKick(t, g) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), gn = audioCtx.createGain();
  o.connect(gn); gn.connect(audioCtx.destination);
  o.type = 'sine'; o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(35, t + 0.12);
  gn.gain.setValueAtTime(g||0.25, t); gn.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
  o.start(t); o.stop(t + 0.18);
}
function playSnare(t, g) {
  if (!audioCtx) return;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.12, audioCtx.sampleRate);
  const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const n = audioCtx.createBufferSource(); n.buffer = buf;
  const f = audioCtx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1200;
  const gn = audioCtx.createGain();
  n.connect(f); f.connect(gn); gn.connect(audioCtx.destination);
  gn.gain.setValueAtTime(g||0.18, t); gn.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  n.start(t); n.stop(t + 0.12);
}
function playHihat(t, g) {
  if (!audioCtx) return;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.06, audioCtx.sampleRate);
  const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const n = audioCtx.createBufferSource(); n.buffer = buf;
  const f = audioCtx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6000;
  const gn = audioCtx.createGain();
  n.connect(f); f.connect(gn); gn.connect(audioCtx.destination);
  gn.gain.setValueAtTime(g||0.10, t); gn.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
  n.start(t); n.stop(t + 0.06);
}

    kick:[0,2,4,6], snare:[1,3,5,7], hihat:[0,0.5,1,1.5,2,2.5,3,3.5,4,4.5,5,5.5,6,6.5,7,7.5],
    melody:[[0,NOTES.D5,0.6],[1,NOTES.F5,0.4],[2,NOTES.E5,0.6],[3,NOTES.C5,0.4],[4,NOTES.D5,0.6],[5,NOTES.A4,0.4],[6,NOTES.F5,0.6],[7,NOTES.E5,0.6]]
  },
  F: { bpm:75, chordGain:.10, drumGain:.26, melodyGain:.13,
    chords:CHORDS_F, chordBeats:[0,2,4,6],
    kick:[0,4], snare:[2,6], hihat:[0,0.5,1,1.5,2,2.5,3,3.5,4,4.5,5,5.5,6,6.5,7,7.5],
    melody:[[0,NOTES.A4,1.5],[2,NOTES.C5,1.5],[4,NOTES.E5,1.5],[6,NOTES.G5,1.5]]
  },
  G: { bpm:45, chordGain:.05, drumGain:.12, melodyGain:.07,
    chords:CHORDS_G, chordBeats:[0,2,4,6],
    kick:[0,4], snare:[], hihat:[1,3,5,7],
    melody:[[0,NOTES.G4,3.5],[4,NOTES.A4,3.5]]
  }
};

let bgmMode = 'A', bgmPlaying = false, bgmTimer = null, bgmStarted = false, bgmEnabled = true;

function getBGMConfig() { return MODES[bgmMode] || MODES.A; }

function recentAvgDist() {
  const hist = game.history;
  const last5 = hist.slice(-5);
  if (last5.length < 2) return Infinity;
  let total = 0, cnt = 0;
  for (let i = 1; i < last5.length; i++) {
    const a = last5[i-1], b = last5[i];
    if (!a || !a.lastMove || !b || !b.lastMove) return Infinity;
    total += Math.abs(b.lastMove.r - a.lastMove.r) + Math.abs(b.lastMove.c - a.lastMove.c);
    cnt++;
  }
  return cnt > 0 ? total / cnt : Infinity;
}

function hasDragonInAtari() {
  const bd = game.board, N = game.N, visited = Array.from({length:N},()=>Array(N).fill(false));
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (bd[r][c] === 0 || visited[r][c]) continue;
    const color = bd[r][c];
    const group = []; const liberties = new Set(); const stack = [[r,c]]; visited[r][c] = true;
    while (stack.length) {
      const [cr,cc] = stack.pop(); group.push([cr,cc]);
      for (const [nr,nc] of game.neighbors(cr,cc)) {
        if (bd[nr][nc] === color && !visited[nr][nc]) { visited[nr][nc] = true; stack.push([nr,nc]); }
        else if (bd[nr][nc] === 0) liberties.add(nr+','+nc);
      }
    }
    if (group.length >= 5 && liberties.size <= 1) return true;
  }
  return false;
}

function countEmpty() {
  const bd = game.board, N = game.N;
  let e = 0;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (bd[r][c] === 0) e++;
  return e;
}

function getScoreLead() {
  const N = game.N, bd = game.board;
  let bs = 0, ws = 0;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { if (bd[r][c] === 1) bs++; else if (bd[r][c] === 2) ws++; }
  bs += game.captures[1]||0; ws += game.captures[2]||0;
  const visited = Array.from({length:N},()=>Array(N).fill(false));
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (bd[r][c]!==0||visited[r][c]) continue;
    const borders = new Set(), stack = [[r,c]]; visited[r][c] = true;
    while (stack.length) { const [cr,cc]=stack.pop(); for (const [nr,nc] of game.neighbors(cr,cc)) { if (bd[nr][nc]===0&&!visited[nr][nc]){visited[nr][nc]=true;stack.push([nr,nc]);} else if(bd[nr][nc]!==0) borders.add(bd[nr][nc]); } }
    if (borders.size === 1) { const o=[...borders][0]; if (o===1) bs+=3; else ws+=3; }
  }
  return bs - ws;
}

function determineBGMMode() {
  if (!game) return 'A';
  if (game.gameOver) return bgmMode;
  if (!bgmEnabled) return bgmMode;
  const N = game.N;
  // ⑥ 开局
  if (game.history.length < 15) return 'D';
  // ⑦ 终局前
  if (game.passCount === 1) return 'G';
  // ② 大龙危机
  if (hasDragonInAtari()) return 'C';
  // ① 中盘激战
  const avg = recentAvgDist();
  if (avg <= 2) return 'E';
  // ⑤ 官子阶段
  if (countEmpty() < N * 3) return 'G';
  // ③ 白棋领先
  const lead = getScoreLead();
  const threshold = Math.max(6, N * 0.5);
  if (lead < -threshold) return 'F';
  // ⑧ 任一方优势
  if (Math.abs(lead) > threshold) return 'B';
  return 'A';
}

// ④ 逆转/大吃：单手提子 ≥3 时播放一次强音，不切换模式
function playStinger() {
  try {
    initAudio();
    const now = audioCtx.currentTime;
    playChord([NOTES.C4,NOTES.E4,NOTES.G4,NOTES.C5], now, 0.6, 0.18);
    playChord([NOTES.G4,NOTES.B4,NOTES.D5,NOTES.G5], now + 0.1, 0.5, 0.14);
    playKick(now, 0.35);
    playKick(now + 0.4, 0.25);
    playSnare(now + 0.2, 0.20);
  } catch(e) {}
}

// ——— 调度：精准安排在 audio clock 上 ———
function playBGMLoop() {
  if (!bgmPlaying || !audioCtx) return;
  const m = determineBGMMode();
  if (m !== bgmMode) { bgmMode = m; }
  const cfg = getBGMConfig();
  const beatSec = 60 / cfg.bpm;
  const totalBeats = 8;
  const now = audioCtx.currentTime;

  for (let b = 0; b < totalBeats; b++) {
    const t = now + b * beatSec;
    // 和弦
    const ci = cfg.chordBeats.indexOf(b);
    if (ci >= 0) {
      const freqs = cfg.chords[ci % cfg.chords.length];
      // 和弦持续到下个和弦
      const nextB = ci + 1 < cfg.chordBeats.length ? cfg.chordBeats[ci + 1] : totalBeats;
      playChord(freqs, t, (nextB - b) * beatSec * 0.9, cfg.chordGain);
    }
    // 鼓
    if (cfg.kick.includes(b)) playKick(t, cfg.drumGain);
    if (cfg.snare.includes(b)) playSnare(t, cfg.drumGain);
    if (cfg.hihat.includes(b)) playHihat(t, cfg.drumGain * 0.4);
    // 旋律（支持半拍 .5）
    for (const [beat, freq, dur] of cfg.melody) {
      if (Math.abs(beat - b) < 0.01) playPianoNote(freq, t, dur * beatSec, cfg.melodyGain);
    }
  }
  // 八分音符补充（melody / hihat 用 .5 拍）
  for (let b = 0; b < totalBeats; b++) {
    const t = now + (b + 0.5) * beatSec;
    if (cfg.hihat.includes(b + 0.5)) playHihat(t, cfg.drumGain * 0.4);
    for (const [beat, freq, dur] of cfg.melody) {
      if (Math.abs(beat - (b + 0.5)) < 0.01) playPianoNote(freq, t, dur * beatSec, cfg.melodyGain);
    }
  }

  bgmTimer = setTimeout(() => {
    if (!bgmPlaying) return;
    const m2 = determineBGMMode();
    if (m2 !== bgmMode) { bgmMode = m2; }
    playBGMLoop();
  }, totalBeats * beatSec * 1000 * 0.85);
}

function startBGM() {
  if (bgmPlaying || !bgmEnabled) return;
  if (!audioCtx) { try { initAudio(); } catch(e) { return; } if (!audioCtx) return; }
  bgmPlaying = true;
  bgmMode = determineBGMMode();
  playBGMLoop();
  bgmStarted = true;
}

function stopBGM() {
  bgmPlaying = false; bgmStarted = false;
  if (bgmTimer) { clearTimeout(bgmTimer); bgmTimer = null; }
}

function updateBGM() {
  if (!bgmPlaying) return;
  const m = determineBGMMode();
  if (m !== bgmMode) { bgmMode = m; if (bgmTimer) { clearTimeout(bgmTimer); } playBGMLoop(); }
}

// 显示手指 overlay（移动端落子时触发）
function showFingerOverlay(r, c) {
  const el = handCursor;
  if (!fingerReady && !fingerLoaded) return;
  const {x, y} = renderer.pointToCanvas(r, c);
  const rect = canvas.getBoundingClientRect();
  const px = rect.left + x * (rect.width / canvas.width);
  const py = rect.top + y * (rect.height / canvas.height);
  el.style.display = 'block';
  el.style.left = (px - 24) + 'px';
  el.style.top = (py - 42) + 'px';
  // 强制回流后加 visible class 触发过渡
  void el.offsetWidth;
  el.classList.add('visible');
  clearTimeout(fingerTimeout);
  fingerTimeout = setTimeout(() => {
    el.classList.remove('visible');
    setTimeout(() => { el.style.display = 'none'; }, 250);
  }, 1000);
}

// ---- 更新目数显示 ----
function updateScoreDisplay() {
    const terr = game.computeTerritory();
    let blackTerritory = 0, whiteTerritory = 0;
    for (let r = 0; r < game.N; r++) {
        for (let c = 0; c < game.N; c++) {
            if (terr[r][c] === 1) blackTerritory++;
            else if (terr[r][c] === 2) whiteTerritory++;
        }
    }
    // 日本规则：目 = 领地空点 + 提子数
    const bs = blackTerritory + (game.captures[1] || 0);
    const ws = whiteTerritory + (game.captures[2] || 0) + 7.5;
    blackScoreEl.textContent = bs;
    whiteScoreEl.textContent = ws;
}

// ---- 更新 UI ----
function updateUI() {
  const t = game.turn;
  const thinking = aiThinking_;
  turnDot.className = 'turn-dot ' + (t === 1 ? 'black' : 'white');
  if (game.gameOver) {
    turnText.textContent = '终局';
  } else if (thinking) {
    turnText.textContent = '🤖 AI 思考中…';
  } else {
    turnText.textContent = t === 1 ? '黑棋落子' : '白棋落子';
  }
  blackCap.textContent = game.captures[1] || 0;
  whiteCap.textContent = game.captures[2] || 0;
  const canAct = !game.gameOver && !thinking;
  btnUndo.disabled = !canAct || game.history.length === 0 || game.scores?.byResign;
  btnPass.disabled = !canAct;
  btnTerritory.disabled = game.gameOver;
  btnResign.disabled = !canAct;
  btnCountResult.disabled = game.gameOver;
  btnAI.disabled = game.gameOver || thinking;
  btnAI.classList.toggle('active', aiEnabled);
  btnBGM.classList.toggle('active', bgmEnabled);
  aiThinking.classList.toggle('show', thinking);
  btnTerritory.classList.toggle('active', renderer.showTerritory);
  btnCount.classList.toggle('active', scoreDisplay.style.display !== 'none');
  if (scoreDisplay.style.display !== 'none') updateScoreDisplay();
}

// ---- 执行落子 ----
function doMove(r, c) {
  if (game.gameOver) return;
  if (!game.isValidMove(r, c)) {
    playInvalidSound();
    return;
  }
  const clr = game.turn;
  const prevCap = game.captures[clr] || 0;
  game.placeStone(r, c);
  const capturedNow = (game.captures[clr] || 0) - prevCap;
  if (capturedNow >= 3) playStinger();
  renderer.startAnimation(r, c, clr);
  renderer.cachedTerritory = null;
  if (clr === 1) playBlackMoveSound(); else playWhiteMoveSound();
  if (isTouchDevice) showFingerOverlay(r, c);
  // 首手启动 BGM
  if (!bgmStarted && game.history.length >= 1) startBGM();
  else updateBGM();
  updateUI();
  requestRender();
  if (game.gameOver) { stopBGM(); showResult(); return; }
  // AI 回合 → 自动触发
  if (aiEnabled && game.turn === aiColor && !game.gameOver) {
    scheduleAIMove();
  }
}

// ---- AI 落子 ----
function scheduleAIMove() {
  if (aiMoveTimer) { clearTimeout(aiMoveTimer); aiMoveTimer = null; }
  aiMoveTimer = setTimeout(() => {
    aiMoveTimer = null;
    doAIMove();
  }, 350);
}

function doAIMove() {
  if (game.gameOver || !aiEnabled) return;
  aiThinking_ = true;
  aiOverlay.classList.add('show');
  updateUI();
  const t0 = performance.now();
  const timerEl = document.getElementById('ai-timer');
  timerEl.textContent = '0.00s';
  const timerInterval = setInterval(() => {
    timerEl.textContent = ((performance.now() - t0) / 1000).toFixed(2) + 's';
  }, 80);
  const ai = new GoAI(game, aiColor);
  const move = ai.getBestMove();
  const elapsed = (performance.now() - t0) / 1000;
  clearInterval(timerInterval);
  timerEl.textContent = elapsed.toFixed(2) + 's';
  aiThinking_ = false;
  aiOverlay.classList.remove('show');
  if (move) {
    const clr = game.turn;
    const prevCap = game.captures[clr] || 0;
    game.placeStone(move.r, move.c);
    const capturedNow = (game.captures[clr] || 0) - prevCap;
    if (capturedNow >= 3) playStinger();
    renderer.startAnimation(move.r, move.c, clr);
    renderer.cachedTerritory = null;
    if (clr === 1) playBlackMoveSound(); else playWhiteMoveSound();
    if (!bgmStarted) startBGM(); else updateBGM();
    updateUI();
    turnText.textContent = 'AI 计算 ' + elapsed.toFixed(2) + '秒';
    setTimeout(() => { if (!aiThinking_) updateUI(); }, 3000);
    requestRender();
    if (game.gameOver) { stopBGM(); showResult(); return; }
    if (aiEnabled && game.turn === aiColor && !game.gameOver) {
      scheduleAIMove();
    }
  } else {
    const over = game.pass();
    renderer.cachedTerritory = null;
    updateBGM();
    updateUI();
    requestRender();
    if (over) { stopBGM(); showResult(); }
  }
}

// ---- 棋局保存 / 读取 / 侧边栏 ----
const SAVE_INDEX_KEY = 'go-saves-index';

function getSavesIndex() {
  try {
    const raw = localStorage.getItem(SAVE_INDEX_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}

function setSavesIndex(idx) {
  localStorage.setItem(SAVE_INDEX_KEY, JSON.stringify(idx));
}

function saveGame() {
  try {
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const data = {
      N: game.N,
      board: game.board,
      turn: game.turn,
      captures: game.captures,
      history: game.history,
      koPoint: game.koPoint,
      passCount: game.passCount,
      gameOver: game.gameOver,
      lastMove: game.lastMove,
      territory: game.territory,
      scores: game.scores,
      aiEnabled: aiEnabled,
      aiColor: aiColor
    };
    localStorage.setItem('go-save-' + id, JSON.stringify(data));

    const idx = getSavesIndex();
    const now = new Date();
    const label = '棋局 #' + (idx.length + 1);
    idx.unshift({
      id: id,
      timestamp: now.getTime(),
      label: label,
      N: game.N,
      moveCount: game.history.length,
      turn: game.turn
    });
    setSavesIndex(idx);
    refreshSidebar();
    showToast('棋局已保存');
  } catch(e) {
    showToast('保存失败: ' + e.message);
  }
}

function loadGame(id) {
  try {
    const key = id ? 'go-save-' + id : 'go-save';
    const raw = localStorage.getItem(key);
    if (!raw) { showToast('没有找到存档'); return false; }
    const data = JSON.parse(raw);
    if (!data.N || !data.board) { showToast('存档数据损坏'); return false; }

    resultOverlay.classList.remove('show');
    if (game) { aiOverlay.classList.remove('show'); }
    stopBGM();
    bgmEnabled = true;
    game = new GoGame(data.N);
    game.restore(data);
    renderer = new BoardRenderer(canvas, game);
    aiEnabled = data.aiEnabled || false;
    aiColor = data.aiColor || 2;
    aiThinking_ = false;
    if (aiMoveTimer) { clearTimeout(aiMoveTimer); aiMoveTimer = null; }
    resize();
    updateUI();
    requestRender();
    closeSidebar();
    showToast('棋局已读取');
    if (aiEnabled && game.turn === aiColor && !game.gameOver) {
      scheduleAIMove();
    }
    return true;
  } catch(e) {
    showToast('读取失败: ' + e.message);
    return false;
  }
}

function deleteSave(id) {
  try {
    localStorage.removeItem('go-save-' + id);
    let idx = getSavesIndex();
    idx = idx.filter(s => s.id !== id);
    setSavesIndex(idx);
    refreshSidebar();
    showToast('已删除');
  } catch(e) {
    showToast('删除失败');
  }
}

function refreshSidebar() {
  const idx = getSavesIndex();
  sidebarCount.textContent = idx.length + ' 局';
  if (idx.length === 0) {
    sidebarList.innerHTML = '<div class="sidebar-empty">暂无保存的棋局<br>对局中点击 💾 保存</div>';
    return;
  }
  sidebarList.innerHTML = idx.map(s => {
    const sizeLabel = s.N + '×' + s.N;
    const d = new Date(s.timestamp);
    const dateStr = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    const turnLabel = s.turn === 1 ? '黑棋' : '白棋';
    return '<div class="sidebar-item" data-id="' + s.id + '">' +
      '<div class="info">' +
        '<div class="name">' + s.label + '</div>' +
        '<div class="meta">' + sizeLabel + ' · ' + s.moveCount + '手 · ' + turnLabel + ' · ' + dateStr + '</div>' +
      '</div>' +
      '<button class="del" data-id="' + s.id + '">✕</button>' +
    '</div>';
  }).join('');

  sidebarList.querySelectorAll('.sidebar-item').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('.del')) return;
      const id = el.dataset.id;
      if (aiMoveTimer) { clearTimeout(aiMoveTimer); aiMoveTimer = null; }
      aiThinking_ = false;
      loadGame(id);
    });
  });
  sidebarList.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      deleteSave(btn.dataset.id);
    });
  });
}

function closeSidebar() {
  sidebar.classList.remove('open');
  sidebarBackdrop.classList.remove('show');
}

function toggleSidebar() {
  const open = sidebar.classList.toggle('open');
  sidebarBackdrop.classList.toggle('show', open);
  if (open) refreshSidebar();
}

function showToast(msg) {
  const el = document.getElementById('toast') || (() => {
    const t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 20px;border-radius:20px;font-size:14px;z-index:300;transition:opacity .3s;pointer-events:none';
    document.body.appendChild(t);
    return t;
  })();
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 2000);
}

// ---- 交互坐标转换 ----
function getCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  let cx, cy;
  if (e.changedTouches && e.changedTouches.length > 0) {
    cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY;
  } else if (e.touches && e.touches.length > 0) {
    cx = e.touches[0].clientX; cy = e.touches[0].clientY;
  } else {
    cx = e.clientX; cy = e.clientY;
  }
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  let px = (cx - rect.left) * scaleX;
  let py = (cy - rect.top) * scaleY;
  px = (px - renderer.transX) / renderer.scale;
  py = (py - renderer.transY) / renderer.scale;
  return {px, py};
}

function getNearestIntersection(e) {
  const {px, py} = getCanvasCoords(e);
  return renderer.canvasToPoint(px, py);
}

// ---- 鼠标事件 ----
canvas.addEventListener('mousemove', e => {
  if (!game || game.gameOver || aiThinking_) { renderer.ghostPos = null; requestRender(); return; }
  const pt = getNearestIntersection(e);
  if (pt && game.isValidMove(pt.r, pt.c)) {
    renderer.ghostPos = {r: pt.r, c: pt.c, color: game.turn};
  } else {
    renderer.ghostPos = null;
  }
  requestRender();
});

canvas.addEventListener('mouseleave', () => {
  if (!renderer) return;
  renderer.ghostPos = null;
  requestRender();
});

canvas.addEventListener('click', e => {
  if (aiThinking_) return;
  initAudio();
  const pt = getNearestIntersection(e);
  if (pt) doMove(pt.r, pt.c);
});

// ---- 触屏事件 ----
let touchId = null;
let pinchDist = 0;
let pinchScale = 1;
let isDragging = false;
let dragStartX = 0, dragStartY = 0;
let dragTransX = 0, dragTransY = 0;

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (aiThinking_) return;
  initAudio();
  if (e.touches.length === 1) {
    touchId = e.touches[0].identifier;
    const pt = getNearestIntersection(e);
    if (pt && !game.gameOver) renderer.ghostPos = {r: pt.r, c: pt.c, color: game.turn};
    isDragging = false;
    dragStartX = e.touches[0].clientX;
    dragStartY = e.touches[0].clientY;
    dragTransX = renderer.transX;
    dragTransY = renderer.transY;
    requestRender();
  } else if (e.touches.length === 2) {
    const t1 = e.touches[0], t2 = e.touches[1];
    pinchDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
    pinchScale = renderer.scale;
  }
}, {passive: false});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    const dx = e.touches[0].clientX - dragStartX;
    const dy = e.touches[0].clientY - dragStartY;
    if (Math.abs(dx) > 8 || Math.abs(dy) > 8) isDragging = true;
    if (isDragging) {
      renderer.transX = dragTransX + dx;
      renderer.transY = dragTransY + dy;
      renderer.ghostPos = null;
    } else {
      const pt = getNearestIntersection(e);
      if (pt && !game.gameOver) renderer.ghostPos = {r: pt.r, c: pt.c, color: game.turn};
    }
    requestRender();
  } else if (e.touches.length === 2) {
    const t1 = e.touches[0], t2 = e.touches[1];
    const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
    if (pinchDist > 0) {
      renderer.scale = Math.max(0.5, Math.min(3, pinchScale * (dist / pinchDist)));
      requestRender();
    }
  }
}, {passive: false});

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (aiThinking_) { renderer.ghostPos = null; requestRender(); return; }
  if (!isDragging && e.changedTouches.length === 1) {
    const t = e.changedTouches[0];
    if (t.identifier === touchId) {
      const pt = getNearestIntersection(e);
      if (pt) doMove(pt.r, pt.c);
    }
  }
  renderer.ghostPos = null;
  requestRender();
}, {passive: false});

// ---- 控制按钮 ----
btnUndo.addEventListener('click', () => {
  if (game.history.length === 0 || aiThinking_) return;
  game.undo();
  renderer.cachedTerritory = null;
  if (renderer.showTerritory) renderer.cachedTerritory = game.computeTerritory();
  updateBGM();
  updateUI();
  requestRender();
  if (aiEnabled && game.turn === aiColor && !game.gameOver) scheduleAIMove();
});

btnPass.addEventListener('click', () => {
  if (aiThinking_) return;
  const over = game.pass();
  renderer.cachedTerritory = null;
  updateBGM();
  updateUI();
  requestRender();
  if (over) { stopBGM(); showResult(); return; }
  if (aiEnabled && game.turn === aiColor) scheduleAIMove();
});

btnTerritory.addEventListener('click', () => {
  if (game.gameOver) return;
  renderer.showTerritory = !renderer.showTerritory;
  if (renderer.showTerritory) {
    renderer.cachedTerritory = game.computeTerritory();
  } else {
    renderer.cachedTerritory = null;
  }
  updateUI();
  requestRender();
});

btnResign.addEventListener('click', () => {
  if (game.gameOver) return;
  game.resign();
  stopBGM();
  updateUI();
  showResult();
  requestRender();
});

btnCount.addEventListener('click', () => {
  if (scoreDisplay.style.display === 'none') {
    updateScoreDisplay();
    scoreDisplay.style.display = 'inline';
    btnCount.classList.add('active');
  } else {
    scoreDisplay.style.display = 'none';
    btnCount.classList.remove('active');
  }
  updateUI();
});

btnCountResult.addEventListener('click', () => {
  if (game.gameOver) return;
  game.gameOver = true;
  game.calculateScore();
  renderer.cachedTerritory = game.territory;
  renderer.showTerritory = false;
  stopBGM();
  updateUI();
  showResult();
  requestRender();
});

btnAI.addEventListener('click', () => {
  if (game.gameOver || aiThinking_) return;
  aiEnabled = !aiEnabled;
  updateUI();
  if (aiEnabled && game.turn === aiColor) scheduleAIMove();
});

btnSave.addEventListener('click', saveGame);

btnLoad.addEventListener('click', () => {
  toggleSidebar();
});

btnBGM.addEventListener('click', () => {
  bgmEnabled = !bgmEnabled;
  if (bgmEnabled) {
    if (game && !game.gameOver && !bgmPlaying) startBGM();
  } else {
    stopBGM();
  }
  updateUI();
});

sidebarToggle.addEventListener('click', toggleSidebar);
sidebarBackdrop.addEventListener('click', closeSidebar);
sidebarNew.addEventListener('click', () => {
  closeSidebar();
  sizeOverlay.classList.add('show');
});

btnRestart.addEventListener('click', () => {
  resultOverlay.classList.remove('show');
  sizeOverlay.classList.add('show');
});

// ---- 结果弹窗 ----
function showResult() {
  const s = game.scores;
  if (!s) return;
  if (s.byResign) {
    const winner = s.winner === 1 ? '黑棋' : '白棋';
    resultTitle.textContent = `${s.resigner}认输，${winner}胜！`;
    resultDetail.textContent = '';
    resultBreakdown.textContent = '';
  } else {
    const winner = s.winner === 1 ? '黑棋' : '白棋';
    const diff = (s.winner === 1 ? s.blackScore - s.whiteScore : s.whiteScore - s.blackScore);
    resultTitle.textContent = `${winner}胜 ${diff.toFixed(1)} 子`;
    resultDetail.textContent = `黑 ${s.blackScore.toFixed(1)} 子 · 白 ${s.whiteScore.toFixed(1)} 子 (含贴目 ${s.komi})`;
    resultBreakdown.textContent = `棋盘共 361 交叉点 · 中国规则数子法`;
  }
  resultOverlay.classList.add('show');
}

// ---- 主渲染循环 ----
function tick() {
  if (renderer) {
    if (renderer.animating) {
      const a = renderer.animating;
      const elapsed = performance.now() - a.startTime;
      a.progress = Math.min(1, elapsed / 200);
      if (a.progress >= 1) renderer.animating = null;
      needsRender = true;
    }
    if (needsRender) {
      renderer.render();
      needsRender = false;
    }
  }
  requestAnimationFrame(tick);
}

// ---- 窗口调整 ----
function resize() {
  if (!renderer) return;
  renderer.calcSize();
  requestRender();
}
window.addEventListener('resize', resize);

// ---- 键盘快捷键 ----
document.addEventListener('keydown', e => {
  if (e.key === 'z' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); btnUndo.click(); }
});

// ============================================================
// ====================== 5. 初始化 ============================
// ============================================================
const sizeOverlay = document.getElementById('size-overlay');

function startGame(N) {
  game = new GoGame(N);
  renderer = new BoardRenderer(canvas, game);
  sizeOverlay.classList.remove('show');
  closeSidebar();
  if (aiMoveTimer) { clearTimeout(aiMoveTimer); aiMoveTimer = null; }
  aiOverlay.classList.remove('show');
  stopBGM();
  bgmEnabled = true;
  aiEnabled = false;
  aiThinking_ = false;
  resize();
  game.computeValidMoves();
  updateUI();
  tick();
}

document.querySelectorAll('.size-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const N = parseInt(btn.dataset.size);
    startGame(N);
  });
});

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => {
    sizeOverlay.classList.add('show');
    refreshSidebar();
  });
} else {
  sizeOverlay.classList.add('show');
  refreshSidebar();
}
</script>
</body>
</html>
